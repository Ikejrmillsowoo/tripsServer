# Application
spring.application.name=TripPlanner
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/trip_planner
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=your-secret-key-change-this-in-production-make-it-long-and-random
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:3000

# Jackson (for proper JSON serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC