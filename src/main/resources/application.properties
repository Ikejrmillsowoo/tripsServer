# Application
spring.application.name=TripPlanner
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/trip_planner
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=your-very-long-secret-key-at-least-256-bits-for-hs256-algorithm-change-this-in-production-please-make-it-even-longer
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Jackson (for proper JSON serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC